<meta charset="utf-8">

{% include seo.html %}

{% unless site.atom_feed.hide %}
<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}"
  type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
{% endunless %}

{%- comment %} https://docs.google.com/presentation/d/1rmxwWa9P6_xHqonmh5ONXRS-jPc5XKbnv99Rjkhe04s/present {% endcomment
-%}
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  {% if site.enable_copy_code_button %}
  window.enable_copy_code_button = true;
  {% endif %}
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css" as="style"
  onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css">
</noscript>

<style>
  /* 전체 본문(오른쪽 컬럼) */
  .layout--single .page__inner-wrap .page__content,
  .layout--home .page__inner-wrap .page__content,
  .page__inner-wrap .page__content {
    font-size: 0.5rem !important;
    line-height: 1.6 !important;
  }

  /* 제목 (Bio, News 등) */
  .archive__subtitle {
    font-size: 1.5em !important;
    /* Increased font size for titles */
    font-weight: bold;
    margin-bottom: 0.5rem;
    margin-top: 1.5rem;
  }

  /* Bio / News - Smaller font (Body) */
  .page__content .bio,
  .page__content .news {
    font-size: 0.65em !important;
    /* Decreased to 0.65em */
    line-height: 1.6;
    font-family: "Roboto", serif;
  }

  /* Publications / Academic Services - Standard font */
  .page__content .publication,
  .page__content .academic-services {
    font-size: 0.8em !important;
    line-height: 1.6;
    font-family: "Roboto", serif;
  }

  .page__content .academic-services p+ul {
    margin-top: 0.1rem !important;
  }

  /* 리스트 전체 여백 정리 */
  .page__content .academic-services ul {
    margin-bottom: 0;
    margin-left: 1.2rem;
    padding-left: 0;
  }

  .page__content .academic-services li {
    margin: 0;
    line-height: 1.4;
  }

  /* Publication 내부 구조 */
  .publication-cell {
    display: flex !important;
    align-items: flex-start;
    gap: 1.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid #e0e0e0;
    margin-bottom: 2rem;
  }

  .publication-cell:last-child {
    border-bottom: none;
    margin-bottom: 0;
  }

  .publication-cell .thumbnail {
    /* Maximum size as requested */
    flex: 0 0 300px !important;
    height: 300px !important;
    overflow: hidden;
    border-radius: 6px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  }

  .publication-cell .thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .publication-cell .desc-cell {
    flex: 1;
    font-size: 0.85em !important;
    /* Adjusted to fit content */
    line-height: 1.5;
  }

  .publication-cell .desc-cell header {
    all: unset;
    display: block;
    font-size: 1.15em !important;
    font-weight: 700;
    margin-bottom: 0.5rem;
    color: #222;
  }

  /* Conference Emphasis */
  .publication-cell .desc-cell .conference {
    color: #0056b3;
    /* Dark Blue for emphasis */
    font-weight: bold;
    margin-top: 0.3rem;
  }

  /* Academic Services */
  .page__content .academic-services p {
    margin: 0.25rem 0;
  }

  .page__content .academic-services b {
    font-weight: 600;
    margin-right: 0.4rem;
  }

  .page__content .academic-services a {
    color: #0044cc;
    text-decoration: underline;
  }

  /* Avatar */
  .author__avatar img {
    width: 200px !important;
    height: 225px !important;
    border-radius: 50%;
    object-fit: cover;
  }

  /* Sidebar always visible */
  @media (min-width: 64em) {
    .sidebar {
      opacity: 1;
      transition: none;
    }
  }

  /* Mobile tweak */
  @media (max-width: 640px) {
    .page__inner-wrap .page__content {
      font-size: 0.75rem !important;
    }

    .publication-cell .thumbnail {
      /* Reduce thumbnail on mobile */
      flex: 0 0 120px !important;
      height: 120px !important;
    }
  }
</style>

{% if site.head_scripts %}
{% for script in site.head_scripts %}
<script src="{{ script | relative_url }}"></script>
{% endfor %}
{% endif %}
